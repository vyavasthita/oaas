[tool.poetry]

name = "tic tac toe"
version = "0.1.0"
description = "Tic Tac Toe Backend"
authors = ["Dilip Sharma"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~=3.13"  # Python runtime version
pydantic-settings = "^2.7.1"  # Settings management using Pydantic
poetry-plugin-export = "^1.9.0"  # Poetry plugin for exporting requirements.txt

[tool.poetry.group.core.dependencies]
fastapi = "^0.115.8"  # FastAPI web framework
uvicorn = "^0.34.0"  # ASGI server for FastAPI

# Observability & OpenTelemetry core dependencies
opentelemetry-api = "^1.39.1"  # OTel API (required for all OTel features)
opentelemetry-sdk = "^1.39.1"  # OTel SDK (required for all OTel features)
opentelemetry-exporter-otlp = "^1.39.1"  # OTLP exporter (generic, HTTP/gRPC)
opentelemetry-exporter-otlp-proto-http = "^1.39.1"  # OTLP HTTP exporter (used for logs/traces)
opentelemetry-instrumentation = "^0.60b1"  # OTel auto-instrumentation base
opentelemetry-instrumentation-fastapi = "^0.60b1"  # FastAPI tracing integration
opentelemetry-instrumentation-asgi = "^0.60b1"
prometheus-client = "^0.20.0"  # Prometheus Python client for custom metrics
httpx = "^0.28.1"
opentelemetry-exporter-prometheus = "^0.60b1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"