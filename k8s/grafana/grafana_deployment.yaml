# -----------------------------------------------------------------------------------
# OAAS Observability: Grafana Deployment
#
# Purpose:
#   - Deploys the Grafana server in the oaas-observability namespace.
#   - Connects Grafana to all provisioned datasources and dashboards via ConfigMaps.
#
# How it works:
#   - Mounts ConfigMaps for datasources, dashboard providers, and dashboard definitions.
#   - Sets admin credentials and required plugins via environment variables.
#   - Exposes Grafana on port 3000 within the cluster.
#   - Readiness/liveness probes ensure Grafana is healthy before service exposure.
#
# Consumers:
#   - Consumed by kubectl/apply and the K8s controller to create the Grafana pod.
#   - Maintainers: Update this file to change Grafana version, plugins, or volume mounts.
#   - Grafana pod reads mounted ConfigMaps at runtime for provisioning.
# -----------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: oaas-observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_INSTALL_PLUGINS
              value: grafana-opensearch-datasource
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 30
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-definitions
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-providers
          configMap:
            name: grafana-dashboards-providers
        - name: grafana-dashboard-definitions
          configMap:
            name: grafana-dashboard-definitions
