apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: oaas-observability
  labels:
    app: tempo
data:
  tempo.yaml: |
    # Minimal Grafana Tempo configuration for Docker Compose
    auth_enabled: false

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
            http:

    ingester:
      trace_idle_period: 10s
      max_block_bytes: 100_000_000
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 48h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
