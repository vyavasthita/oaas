
# Processors for OpenTelemetry Collector
# Processors transform, batch, or enrich telemetry data.
# The batch processor is recommended for production use.
# Adds a batch processor, which groups logs for efficient export. This is a best practice for performance and reliability.

processors:
  batch:
    timeout: 10s
  attributes/loki:
      actions:
        - key: "service.name"
          action: insert
          from_attribute: "service.name"
        - key: "severity"
          action: insert
          from_attribute: "severity"
        - key: "container.name"
          action: insert
          from_attribute: "container.name"
  attributes/log-labels:
    actions:
      - key: "service.name"
        action: insert
        from_attribute: "service.name"
      - key: "severity"
        action: insert
        from_attribute: "severity"
      - key: "container.name"
        action: insert
        from_attribute: "container.name"