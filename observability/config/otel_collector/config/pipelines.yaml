# Service pipelines for OpenTelemetry Collector
# ---------------------------------------------
# Each pipeline references the processor names declared in processors.yaml. The collector executes
# processors in the exact order listed *per pipeline*, so the sequence here is critical:
#   1. batch or batch/metrics smooth incoming traffic;
#   2. attribute mutators enrich telemetry with fields that Loki/Tempo/Prometheus require;
#   3. routing/* reads the backend hint stored on the resource (logging_backend, etc.) and fans the
#      signal out to the right exporter. Nothing can appear after routing or it will never see data.
# Exporters listed below still receive data, but routing decides which subset each signal forwards to.

service:
  pipelines:
    logs:
      receivers: [otlp]
      # Logs run through batching, then both attribute processors (labels for Grafana + Loki).
      # routing/logs must be last so it can look at logging_backend and decide which exporter to use.
      processors: [batch, attributes/log-labels, attributes/loki, routing/logs]
      exporters: [loki, elasticsearch/opensearch]
    traces:
      receivers: [otlp]
      # Traces only need batching before routing. routing/traces reads tracing_backend from the
      # resource and forwards spans to the matching exporter endpoint (Tempo today, extensible later).
      processors: [batch, routing/traces]
      exporters: [otlp]

    metrics:
      receivers: [otlp]
      # Metrics use a dedicated batch processor that respects metric reader cadence, then routing
      # picks the metrics_backend (Prometheus by default) so future backends can be toggled via env.
      processors: [batch/metrics, routing/metrics]
      exporters: [prometheus]
