# Exporters for OpenTelemetry Collector
# Exporters send telemetry data to external backends.
# Here, we configure the Loki exporter for logs.
# Configures the Loki exporter, which sends logs to our Loki service.
exporters:
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  elasticsearch/opensearch:
    endpoints: ["http://opensearch:9200"]
    logs_index: "otel-logs"
    tls:
      insecure: true

  otlp:
    endpoint: http://tempo:4317
    tls:
      insecure: true

  # Dedicated gRPC exporter for Jaeger so each traces backend has its own OTLP
  # connection but the collector can still route per-service traffic dynamically.
  otlp/jaeger:
    endpoint: http://jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"
