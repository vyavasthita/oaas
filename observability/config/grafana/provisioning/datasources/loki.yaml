apiVersion: 1
# Loki data source configuration for Grafana provisioning
# Moved from grafana/provisioning/datasources/loki.yaml
# Place this file in observability/config/grafana/provisioning/datasources/loki.yaml

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    version: 1
    jsonData:
      maxLines: 1000
