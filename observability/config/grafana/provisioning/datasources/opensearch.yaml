apiVersion: 1

# Provision OpenSearch so logs stored outside Loki still show up in Grafana Explore

datasources:
  - name: OpenSearch Logs
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: false
    editable: true
    jsonData:
      database: "otel-logs"
      timeField: "@timestamp"
      timeFieldType: "timestamp"
      flavor: "opensearch"
      version: "2.11.0"
      logMessageField: "Body"
      logLevelField: "SeverityText"
