events {}

http {
  # Route every request through the real OpenSearch node so we can inject
  # additional headers without touching the upstream container image.
  upstream opensearch_backend {
    server opensearch-core:9200;
  }

  server {
    # The Collector and Grafana talk to http://opensearch:9200, so we bind the
    # proxy to that familiar address and forward everything to opensearch-core.
    listen 0.0.0.0:9200;
    proxy_http_version 1.1;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      # The OpenTelemetry elasticsearch exporter refuses to ingest logs unless
      # the upstream replies with X-Elastic-Product=Elasticsearch. OpenSearch
      # omits that header, so this proxy adds it unconditionally before the
      # response goes back to the Collector. Example:
      #   curl -I http://localhost:9200/
      #   ...
      #   X-Elastic-Product: Elasticsearch
      add_header X-Elastic-Product "Elasticsearch" always;

      proxy_pass http://opensearch_backend;
      proxy_buffering off;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }
  }
}
