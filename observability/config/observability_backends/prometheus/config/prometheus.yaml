# config file for prometheus
# Moved from data/prometheus/prometheus.yml

# global config
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# 🔴 ADD THIS: load alert rules
rule_files:
  - "/etc/prometheus/rules/test-alerts.yaml"


# 🔔 Alertmanager integration (UNCHANGED)
alerting:
  alertmanagers:
    - follow_redirects: true
      enable_http2: true
      scheme: http
      timeout: 10s
      api_version: v2
      static_configs:
        - targets: ['alertmanager:9093']

# 📊 Scrape configs
scrape_configs:
  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    follow_redirects: true
    enable_http2: true
    static_configs:
      - targets:
          - localhost:9090

  - job_name: 'otel-collector'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']  # must match exporter endpoint

# 📌 To scrape additional workloads directly (instead of via OTLP) add extra
# jobs here pointing at targets reachable over the shared Docker network.

# OTLP vs Prometheus in OTEL collector
# Port 4318 is for OTLP HTTP, while Prometheus exporter uses a different port (8889). It is used by FastAPI app to expose metrics
# Our endpoint OTEL_EXPORTER_PROMETHEUS_ENDPOINT http://otel-collector:4318/v1/metrics reflects this setup.
# Prometheus does not scrape OTLP endpoints directly; it scrapes the Prometheus exporter endpoint instead.
# Port 8889 is specifically for Prometheus exporter port in OTEL collector.
# Prometheus scrapes metrics from the OTEL collector's Prometheus exporter, not the OTLP endpoint.
# So, 4318 is for OTLP ingestion, while 8889 is for Prometheus scraping.