# config file for prometheus
# Moved from data/prometheus/prometheus.yml

# global config
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# 🔴 ADD THIS: load alert rules
rule_files:
  - "/etc/prometheus/rules/test-alerts.yaml"


# 🔔 Alertmanager integration (UNCHANGED)
alerting:
  alertmanagers:
    - follow_redirects: true
      enable_http2: true
      scheme: http
      timeout: 10s
      api_version: v2
      static_configs:
        - targets: ['alertmanager:9093']

# 📊 Scrape configs (UNCHANGED)
scrape_configs:
  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    follow_redirects: true
    enable_http2: true
    static_configs:
      - targets:
          - localhost:9090

  - job_name: 'tic-tac-toe'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['web:8000']
