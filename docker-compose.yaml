  # Loki: log aggregation service for observability
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"  # Expose Loki's HTTP API
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./data/loki/config/loki-config.yaml:/etc/loki/local-config.yaml  # Mount custom config if needed
      - ./data/loki/wal:/wal  # Loki WAL directory must be writable
      - ./data/loki/compactor:/loki/compactor  # Compactor working directory
    networks:
      - tic-tac-toe-network
      
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./data/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - tic-tac-toe-network  


  grafana:
    image: grafana/grafana
    # image: grafana/otel-lgtm
    container_name: grafana
    ports:
      - 8080:3000
      - 4317:4317
      - 4318:4318
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - tic-tac-toe-network

volumes:
  database_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data/database/mysql
  # prometheus_data:
  #   driver: local
  #   driver_opts:
  #     o: bind
  #     type: none
  #     device: ./data/prometheus
  grafana_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data/grafana

networks:
  tic-tac-toe-network: {}