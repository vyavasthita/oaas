services:
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    user: "0"
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/config/observability_backends/loki/config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
      - loki_wal:/wal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - observability

  opensearch-core:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-core
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - compatibility.override_main_response_version=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9201:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - observability

  opensearch:
    image: nginx:1.25-alpine
    container_name: opensearch-proxy
    restart: unless-stopped
    depends_on:
      opensearch-core:
        condition: service_healthy
    ports:
      - "9200:9200"
    volumes:
      - ./observability/config/opensearch/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./observability/config/observability_backends/tempo/config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otel-collector-config.yaml"]
    volumes:
      - ./observability/config/otel_collector/config/otel-collector-config.generated.yaml:/etc/otelcol/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      loki:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      tempo:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    environment:
      - DISCORD_WEBHOOK_URL
    volumes:
      - ./observability/config/observability_backends/alertmanager/config/alertmanager.yaml.template:/etc/alertmanager/alertmanager.yaml.template:ro
      - ./observability/config/observability_backends/alertmanager/scripts/alertmanager-entrypoint.sh:/etc/alertmanager/alertmanager-entrypoint.sh:ro
    entrypoint: ["/etc/alertmanager/alertmanager-entrypoint.sh"]
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    volumes:
      - ./observability/config/observability_backends/prometheus/config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./observability/config/observability_backends/prometheus/config/test-alerts.yaml:/etc/prometheus/rules/test-alerts.yaml:ro
    depends_on:
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_started
    networks:
      - observability

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-opensearch-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - observability

volumes:
  grafana_data:
  loki_data:
  loki_wal:
  tempo_data:
  opensearch_data:

networks:
  observability:
    external: true
    name: ${OBSERVABILITY_NETWORK_NAME:-oaas-observability-net}