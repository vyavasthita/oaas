services:
  database:
    image: mysql:8.0.29
    container_name: database
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 3s
      retries: 5
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - tic-tac-toe-network
  
  # database:
  #   image: TBD
  #   restart: unless-stopped
  #   container_name: ttt-xtradb
  #   ports:
  #     - "3312:3306"
  #   volumes:
  #      - ./sql:/var/lib/sql/
  #   environment:
  #     MYSQL_ROOT_PASSWORD: temp123
  #     EXTUSER: "ttt:some_password"
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysql -uroot -ptemp123 -e 'select 1'"]
  #     start_period: 5s
  #     interval: 5s
  #     retries: 30
  #   networks:
  #     - tic-tac-toe-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-admin
    restart: always
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - tic-tac-toe-network

  # db-migration:
  #   image: TBD
  #   container_name: db-migration
  #   depends_on:
  #     database:
  #       condition: service_healthy
  #   environment:
  #     MYSQL_USERNAME: root
  #     MYSQL_PASSWORD: temp123
  #     MYSQL_HOST: database
  #     CHANGELOG_FILE: /liquibase/changelog/test_data/sql/local_dev_changelog.yml
  #     LIQUIBASE_COMMAND_URL: jdbc:mysql://databaseb:3306/tictactoe?allowPublicKeyRetrieval=true&useSSL=true&createDatabaseIfNotExist=true
  #     OPERATION: update
  #     MYSQL_DATABASE: tictactoe
  #     LIQUIBASE_LOG_LEVEL: DEBUG
  #   volumes: 
  #     - ../backend/changelog:/liquibase/changelog
  #   networks:
  #     - tic-tac-toe-network

  mysql-workbench:
    image: lspipepr/mysql-workbench:version-8.0.28
    container_name: mysql-workbench
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - 3000:3000
      - 3001:3001
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - tic-tac-toe-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    container_name: backend
    environment: {}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:5000/health || exit 1
      start_period: 10s
      interval: 20s
    networks:
      - tic-tac-toe-network

