services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    container_name: backend
    # command: uvicorn src.api:app --host 0.0.0.0 --port 5000
    healthcheck:
      test: curl --fail http://localhost:5000/health || exit 1
      start_period: 10s
      interval: 10s
    networks:
      - tic-tac-toe-network
networks:
  tic-tac-toe-network: {}